<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an Account - Register</title>
    <meta
      name="description"
      content="A beautiful, responsive registration page to create an account."
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Phosphor Icons for high quality UI icons -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://unpkg.com/@phosphor-icons/web/src/fill/style.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Animated Background Shapes -->
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <!-- Login Card container -->
    <main class="login-container">
      <!-- Logo and Heading -->
      <header class="login-header">
        <div class="logo">
          <i class="ph-fill ph-infinity"></i>
        </div>
        <h1>Create an Account</h1>
        <p>Please enter your details to sign up.</p>
      </header>

      <!-- Registration Form -->
      <form class="login-form" novalidate>
        <!-- Name Input -->
        <div class="input-group">
          <label for="name">Full Name</label>
          <div class="input-wrapper">
            <i class="ph ph-user"></i>
            <input
              type="text"
              id="name"
              placeholder="John Doe"
              required
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Email Input -->
        <div class="input-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="ph ph-envelope"></i>
            <input
              type="email"
              id="email"
              placeholder="hello@example.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="ph ph-lock-key"></i>
            <input
              type="checkbox"
              id="toggle-password"
              class="toggle-checkbox"
            />
            <input
              type="text"
              id="password"
              class="password-input"
              placeholder="••••••••"
              required
              autocomplete="new-password"
            />
            <label
              for="toggle-password"
              class="password-toggle"
              aria-label="Toggle password visibility"
            >
              <i class="ph ph-eye"></i>
              <i class="ph ph-eye-slash hide-icon"></i>
            </label>
          </div>
        </div>

        <!-- Submit Buttons -->
        <input type="checkbox" id="register-submit" class="submit-toggle" />
        <label for="register-submit" class="btn-submit">
          <span class="btn-text">Sign Up</span>
          <span class="btn-loading"
            ><i class="ph ph-spinner ph-spin"></i> Signing up...</span
          >
        </label>
        <button type="button" class="btn-google">
          <img
            src="https://www.svgrepo.com/show/475656/google-color.svg"
            alt="Google"
            class="google-icon"
          />
          Sign up with Google
        </button>

        <!-- Redirect Overlay -->
        <div class="redirect-overlay">
          <i class="ph-fill ph-check-circle"></i>
          <h2>Account Created!</h2>
          <a href="index.html" class="redirect-btn">Continue to Login</a>
        </div>
      </form>

      <!-- Footer link -->
      <footer class="login-footer">
        <p>Already have an account? <a href="index.html">Sign in</a></p>
      </footer>
    </main>

    <!-- Page Footer -->
    <div class="page-footer">
      <div class="footer-content">
        <i class="ph ph-copyright"></i>
        <span>Barcelona Daniel</span>
        <span class="footer-year">2026</span>
      </div>
    </div>
  </body>
</html>
